[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Py_Recipe_API"
version = "0.0.5"
description = "Py Recipe API is an API for creating and managing recipes"
authors = [
    {name="ConstintCreations"}
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

requires-python = ">=3.10"

dependencies = [
    "fastapi[standard]", "slowapi", "requests", "pillow"
]

keywords = ["api", "recipes"]

classifiers = [
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Natural Language :: English"
]

[project.scripts]
py_recipe_api = "py_recipe_api.main:main"

[project.urls]
Homepage = "https://github.com/ConstintCreations/py-recipe-api"
Repository = "https://github.com/ConstintCreations/py-recipe-api"
